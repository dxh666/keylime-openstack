---
- name: Apply OpenTCSM TPCM dynamic measurement policy
  hosts: keylime_managed
  become: true
  gather_facts: false
  tasks:
    - name: Apply OpenTCSM dynamic measurement commands
      ansible.builtin.shell: |
        python3 - <<'PY'
        import datetime
        import json
        import os
        import re
        import socket
        import subprocess
        import sys

        auth = json.loads(r'''{{ opentcsm_dynamic_auth | to_json }}''')
        policy = json.loads(r'''{{ opentcsm_dynamic_policy | to_json }}''')

        env = os.environ.copy()
        env["LC_ALL"] = "C"
        env["PATH"] = (
            "/usr/local/opentcsm/tcsm/user/test/tcs:"
            "/usr/local/opentcsm/tcsm/user/utils/tcs:"
            "/usr/local/opentcsm/tcsm/user/test/tcm:"
            + env.get("PATH", "")
        )
        env["LD_LIBRARY_PATH"] = (
            "/usr/local/opentcsm/lib:"
            "/usr/local/opentcsm/tcsm/user:"
            "/usr/local/opentcsm/tsb:"
            + env.get("LD_LIBRARY_PATH", "")
        )

        allowed_objects = {"kernel_section", "syscall_table", "idt_table"}
        uid = str(auth["uid"])
        signing_key = str(auth["private_key"]) + str(auth["public_key"])
        default_interval = int(policy.get("environment_interval_milli") or 60000)
        object_configs = policy.get("environment_object_configs") or {}
        delete_unmanaged_objects = bool(policy.get("delete_unmanaged_objects", False))
        desired_configs = {}
        if isinstance(object_configs, dict) and object_configs:
            for name in sorted(allowed_objects):
                config = object_configs.get(name) or {}
                if not config.get("enabled"):
                    continue
                desired_configs[name] = int(config.get("interval_milli") or default_interval)
        else:
            for item in policy.get("environment_objects") or []:
                name = str(item).strip()
                if name not in allowed_objects:
                    raise SystemExit(f"unsupported dynamic measurement object: {name}")
                desired_configs[name] = default_interval

        def redact(command):
            safe = list(command)
            if "-k" in safe:
                index = safe.index("-k")
                if index + 1 < len(safe):
                    safe[index + 1] = "***"
            return safe

        def run(name, command):
            completed = subprocess.run(
                command,
                shell=False,
                check=False,
                capture_output=True,
                text=True,
                encoding="utf-8",
                errors="replace",
                timeout=120,
                env=env,
            )
            return {
                "name": name,
                "command": redact(command),
                "rc": completed.returncode,
                "stdout": completed.stdout,
                "stderr": completed.stderr,
            }

        def parse_policy(text):
            rows = {}
            for match in re.finditer(r"item index:\s*(\d+)", text):
                index = int(match.group(1))
                rows.setdefault(index, {"index": index})
            for match in re.finditer(r"\[(\d+)\]\.be_interval_milli:\s*(0x[0-9A-Fa-f]+|\d+)", text):
                rows.setdefault(int(match.group(1)), {"index": int(match.group(1))})["interval_milli"] = int(match.group(2), 0)
            for match in re.finditer(r"\[(\d+)\]\.object:\s*(.+)", text):
                rows.setdefault(int(match.group(1)), {"index": int(match.group(1))})["object"] = match.group(2).strip()
            return [item for _, item in sorted(rows.items()) if item.get("object")]

        def desired_state_satisfied(observed):
            by_object = {item.get("object"): item for item in observed if item.get("object")}
            for name, expected_interval in desired_configs.items():
                item = by_object.get(name)
                if not item:
                    return False
                if int(item.get("interval_milli") or 0) != expected_interval:
                    return False
            if delete_unmanaged_objects:
                for name in set(by_object) - set(desired_configs):
                    if name in allowed_objects:
                        return False
            return True

        commands = []
        before = run("get_dmeasure_policy_before", ["get_dmeasure_policy"])
        commands.append(before)
        current = {item["object"]: item for item in parse_policy(before.get("stdout") or "")}

        for name, object_interval in desired_configs.items():
            existing = current.get(name)
            current_interval = int(existing.get("interval_milli") or 0) if existing else None
            if existing and current_interval == object_interval:
                commands.append({
                    "name": f"noop_dmeasure_policy_{name}",
                    "command": ["noop", name],
                    "rc": 0,
                    "stdout": f"{name} already enabled with interval {object_interval}",
                    "stderr": "",
                })
                continue
            operation = "3" if existing else "1"
            commands.append(run(
                f"update_dmeasure_policy_{name}",
                [
                    "update_dmeasure_policy",
                    "-o", operation,
                    "-n", name,
                    "-d", str(object_interval),
                    "-u", uid,
                    "-k", signing_key,
                ],
            ))

        if delete_unmanaged_objects:
            for name in sorted(set(current) - set(desired_configs)):
                if name in allowed_objects:
                    commands.append(run(
                        f"delete_dmeasure_policy_{name}",
                        [
                            "update_dmeasure_policy",
                            "-o", "2",
                            "-n", name,
                            "-d", str(default_interval),
                            "-u", uid,
                            "-k", signing_key,
                        ],
                    ))

        after = run("get_dmeasure_policy_after", ["get_dmeasure_policy"])
        commands.append(after)
        observed_after = parse_policy(after.get("stdout") or "")
        global_policy = run("get_global_control_policy_after", ["get_global_control_policy"])
        commands.append(global_policy)

        failed = [item for item in commands if int(item.get("rc") or 0) != 0]
        effective_failed = failed
        ignored_failures = []
        if failed and after.get("rc") == 0 and desired_state_satisfied(observed_after):
            effective_failed = [
                item
                for item in failed
                if item.get("name") in {"get_dmeasure_policy_before", "get_dmeasure_policy_after"}
            ]
            ignored_failures = [
                item.get("name") for item in failed if item not in effective_failed
            ]
        result = {
            "hostname": socket.gethostname(),
            "applied_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "auth_ref": auth.get("ref", ""),
            "auth_uid": uid,
            "desired": {
                "environment_objects": list(desired_configs),
                "environment_object_configs": {
                    name: {
                        "enabled": True,
                        "interval_milli": interval,
                    }
                    for name, interval in desired_configs.items()
                },
                "environment_interval_milli": default_interval,
                "delete_unmanaged_objects": delete_unmanaged_objects,
            },
            "observed_before": parse_policy(before.get("stdout") or ""),
            "observed_after": observed_after,
            "commands": commands,
            "command_failures_ignored": ignored_failures,
            "ok": not effective_failed,
            "error": "; ".join(f"{item['name']} rc={item['rc']}" for item in effective_failed),
        }
        print(json.dumps(result, ensure_ascii=False))
        if effective_failed:
            sys.exit(1)
        PY
      register: opentcsm_dynamic_apply
      ignore_errors: true
      changed_when: opentcsm_dynamic_apply.rc == 0

    - name: Store OpenTCSM dynamic policy result on controller workspace
      ansible.builtin.copy:
        content: "{{ opentcsm_dynamic_apply.stdout }}\n"
        dest: "{{ result_output_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Fail when OpenTCSM dynamic policy command failed
      ansible.builtin.fail:
        msg: "{{ opentcsm_dynamic_apply.stdout | default(opentcsm_dynamic_apply.stderr, true) }}"
      when: opentcsm_dynamic_apply.rc != 0
