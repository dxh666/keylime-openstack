services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: keylime_openstack_postgres
    restart: unless-stopped
    env_file:
      - ${KEYLIME_OPENSTACK_ENV_FILE:-/etc/keylime-openstack/keylime-openstack.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keylime_openstack}
      POSTGRES_USER: ${POSTGRES_USER:-keylime_openstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keylime_openstack}
    volumes:
      - /var/lib/keylime-openstack/postgres:/var/lib/postgresql/data
    networks:
      - trust_plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keylime_openstack} -d ${POSTGRES_DB:-keylime_openstack}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        PYTHON_BIN: ${PYTHON_BIN:-python3}
        INSTALL_OS_TOOLS: ${INSTALL_OS_TOOLS:-true}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: ${KEYLIME_OPENSTACK_IMAGE:-keylime-openstack-trust-plane:latest}
    container_name: keylime_openstack_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${KEYLIME_OPENSTACK_ENV_FILE:-/etc/keylime-openstack/keylime-openstack.env}
    ports:
      - "8088:8088"
    volumes:
      - /etc/kolla:/etc/kolla:ro
      - /opt/keylime-docker:/opt/keylime-docker:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/keylime-openstack:/tmp/keylime-openstack:rw
      - /etc/keylime-openstack/ansible:/etc/keylime-openstack/ansible:ro
    networks:
      - trust_plane

  worker:
    image: ${KEYLIME_OPENSTACK_IMAGE:-keylime-openstack-trust-plane:latest}
    container_name: keylime_openstack_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - ${KEYLIME_OPENSTACK_ENV_FILE:-/etc/keylime-openstack/keylime-openstack.env}
    command: ["sh", "-c", "exec \"$PYTHON_BIN\" -m keylime_openstack.worker"]
    volumes:
      - /etc/kolla:/etc/kolla:ro
      - /opt/keylime-docker:/opt/keylime-docker:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/keylime-openstack:/tmp/keylime-openstack:rw
      - /etc/keylime-openstack/ansible:/etc/keylime-openstack/ansible:ro
    networks:
      - trust_plane

networks:
  trust_plane:
    name: ${KEYLIME_OPENSTACK_DOCKER_NETWORK:-keylime_openstack_net}
    ipam:
      config:
        - subnet: ${KEYLIME_OPENSTACK_DOCKER_SUBNET:-10.245.0.0/24}
