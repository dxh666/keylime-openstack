<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>计算节点可信状态实时监控</title>
  <style>
    :root {
      --bg: #f3f6f7;
      --panel: #ffffff;
      --sidebar: #14232d;
      --sidebar-soft: #203340;
      --line: #d9e0e5;
      --text: #16212b;
      --muted: #657482;
      --accent: #0b6872;
      --ok: #0f8a5f;
      --ok-bg: #e7f6ef;
      --warn: #c47a00;
      --warn-bg: #fff4dc;
      --bad: #c7352b;
      --bad-bg: #fde9e7;
      --shadow: 0 10px 24px rgba(20, 35, 45, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    select {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      padding: 7px 10px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: #aeb9c3;
      background: #fbfcfc;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 17px;
    }

    h3 {
      margin-bottom: 4px;
      font-size: 15px;
    }

    .layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: var(--sidebar);
      color: #eaf1f4;
      padding: 20px 14px;
    }

    .brand {
      padding: 0 8px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 14px;
    }

    .brand strong {
      display: block;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .brand span {
      color: #aebec8;
      font-size: 12px;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-item {
      border-radius: 8px;
      padding: 10px 11px;
      color: #d9e5ea;
      text-decoration: none;
    }

    .nav-item.active {
      background: var(--sidebar-soft);
      color: #ffffff;
      box-shadow: inset 3px 0 0 #65c6d0;
    }

    .main {
      min-width: 0;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .subtle {
      color: var(--muted);
    }

    .row,
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chips {
      justify-content: flex-end;
    }

    .chip,
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.ok {
      color: var(--ok);
      border-color: #9ad7bd;
      background: var(--ok-bg);
    }

    .badge.warn {
      color: var(--warn);
      border-color: #e5c073;
      background: var(--warn-bg);
    }

    .badge.bad {
      color: var(--bad);
      border-color: #f3aaa4;
      background: var(--bad-bg);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      flex: 0 0 auto;
      box-shadow: 0 0 0 4px rgba(100, 116, 139, 0.12);
    }

    .dot.ok {
      background: var(--ok);
    }

    .dot.warn {
      background: var(--warn);
    }

    .dot.bad {
      background: var(--bad);
    }

    .panel,
    .stat,
    .node-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 13px;
      min-height: 86px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 24px;
      font-weight: 760;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, max-content));
      gap: 14px;
      align-items: start;
    }

    .node-card {
      width: min(100%, 360px);
      min-width: 280px;
      padding: 15px;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .node-card:hover,
    .node-card:focus {
      border-color: #aab8c2;
      box-shadow: 0 14px 32px rgba(20, 35, 45, 0.12);
      outline: none;
      transform: translateY(-1px);
    }

    .node-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 13px;
    }

    .node-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .node-title strong {
      display: block;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .expand-mark {
      color: var(--muted);
      font-size: 12px;
      flex: 0 0 auto;
    }

    .kv {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 9px;
      padding: 6px 0;
      border-top: 1px solid #edf1f3;
    }

    .kv .key {
      color: var(--muted);
      font-size: 12px;
    }

    .kv .value {
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .details {
      display: none;
      margin-top: 8px;
    }

    .node-card.expanded .details {
      display: block;
    }

    .notice {
      border: 1px solid #e5c073;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn);
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
    }

    .notice.show {
      display: block;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        padding: 14px;
      }

      .brand {
        margin-bottom: 10px;
        padding-bottom: 12px;
      }

      .main {
        padding: 16px;
      }

      .topbar,
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .chips {
        justify-content: flex-start;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .node-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .node-card {
        width: 100%;
      }
    }

    @media (max-width: 560px) {
      .stats,
      .node-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <strong>可信云管理</strong>
        <span>Keylime + OpenStack</span>
      </div>
      <nav class="nav" aria-label="功能导航">
        <a class="nav-item active" href="#compute-trust">计算节点监控</a>
      </nav>
    </aside>

    <main class="main" id="compute-trust">
      <div class="topbar">
        <h1>计算节点可信状态实时监控</h1>
        <div class="chips">
          <span id="apiBadge" class="badge warn">API 连接中</span>
          <span id="summaryBadge" class="badge warn">等待状态</span>
          <span id="lastUpdate" class="chip">尚未刷新</span>
        </div>
      </div>

      <div id="apiNotice" class="notice">
        未连接到只读状态 API。请使用 <code>python3 trust_monitor_server.py --host 172.31.100.10 --port 8088</code> 启动。
      </div>

      <section class="toolbar">
        <div class="row">
          <button id="refreshNow" class="primary">立即刷新</button>
          <label class="row">
            <span class="subtle">刷新间隔</span>
            <select id="refreshInterval">
              <option value="5">5 秒</option>
              <option value="10">10 秒</option>
              <option value="30">30 秒</option>
            </select>
          </label>
        </div>
        <span id="timerState" class="chip">timer: unknown</span>
      </section>

      <section class="stats" aria-label="节点统计">
        <div class="stat">
          <div class="label">计算节点</div>
          <div id="totalCount" class="value">0</div>
        </div>
        <div class="stat">
          <div class="label">可信</div>
          <div id="trustedCount" class="value">0</div>
        </div>
        <div class="stat">
          <div class="label">不可信 / 下线</div>
          <div id="untrustedCount" class="value">0</div>
        </div>
        <div class="stat">
          <div class="label">未装代理</div>
          <div id="noAgentCount" class="value">0</div>
        </div>
      </section>

      <section>
        <div class="node-grid" id="nodeGrid">
          <div class="panel subtle">正在加载计算节点状态...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      timerId: null,
      expandedHosts: new Set()
    };

    function el(id) {
      return document.getElementById(id);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function badge(kind, text) {
      return `<span class="badge ${kind}">${escapeHtml(text)}</span>`;
    }

    function setBadge(node, kind, text) {
      node.className = `badge ${kind}`;
      node.textContent = text;
    }

    function statusKind(node) {
      return node?.conclusion?.level || "warn";
    }

    function trustText(node) {
      return node?.conclusion?.text || "未知";
    }

    function serviceStateText(node) {
      const service = node.service || {};
      if (service.state === "up" && service.status === "enabled") return "上线";
      if (service.state === "up" && service.status === "disabled") return "上线 / 禁用";
      if (service.state === "down") return "下线";
      return service.state || "未知";
    }

    function agentText(node) {
      return node.agent?.configured ? "已装代理" : "未装代理";
    }

    function traitText(node) {
      const value = node.placement?.trait_present;
      if (value === true) return "可信标记存在";
      if (value === false) return "无可信标记";
      return "可信标记未知";
    }

    function vmCountText(node) {
      const count = node.vm_count;
      if (count === undefined || count === null || count === "" || count === "unknown") {
        return "未知";
      }
      return `${count}`;
    }

    function render(data) {
      const summary = data.summary || {};
      const timer = data.timer || {};
      const nodes = data.nodes || [];

      el("apiNotice").classList.remove("show");
      setBadge(el("apiBadge"), "ok", "API 已连接");
      setBadge(el("summaryBadge"), summary.level || "warn", summary.text || "等待状态");
      el("lastUpdate").textContent = `刷新 ${new Date().toLocaleTimeString()}`;
      el("timerState").textContent = `timer: ${timer.active || "unknown"} / ${timer.enabled || "unknown"}`;

      el("totalCount").textContent = summary.total ?? nodes.length;
      el("trustedCount").textContent = summary.trusted ?? 0;
      el("untrustedCount").textContent = summary.untrusted ?? 0;
      el("noAgentCount").textContent = summary.no_agent ?? 0;

      renderCards(nodes);
    }

    function renderCards(nodes) {
      if (!nodes.length) {
        el("nodeGrid").innerHTML = `<div class="panel subtle">未发现 nova-compute 节点。</div>`;
        return;
      }

      el("nodeGrid").innerHTML = nodes.map((node) => {
        const kind = statusKind(node);
        const expanded = state.expandedHosts.has(node.host);
        return `
          <article class="node-card ${expanded ? "expanded" : ""}" data-host="${escapeHtml(node.host)}" tabindex="0" role="button" aria-expanded="${expanded}">
            <div class="node-head">
              <div class="node-title">
                <span class="dot ${kind}" aria-hidden="true"></span>
                <strong>${escapeHtml(node.host)}</strong>
              </div>
              <span class="expand-mark">${expanded ? "收起" : "详情"}</span>
            </div>
            <div class="kv">
              <div class="key">IP 地址</div>
              <div class="value">${escapeHtml(node.ip || "unknown")}</div>
            </div>
            <div class="kv">
              <div class="key">虚拟机</div>
              <div class="value">${escapeHtml(vmCountText(node))}</div>
            </div>
            <div class="kv">
              <div class="key">可信状态</div>
              <div class="value">${badge(kind, trustText(node))}</div>
            </div>
            <div class="kv">
              <div class="key">服务状态</div>
              <div class="value">${escapeHtml(serviceStateText(node))}</div>
            </div>
            <div class="details">
              <div class="kv">
                <div class="key">Keylime</div>
                <div class="value">${escapeHtml(agentText(node))}</div>
              </div>
              <div class="kv">
                <div class="key">可信标记</div>
                <div class="value">${escapeHtml(traitText(node))}</div>
              </div>
              <div class="kv">
                <div class="key">可用域</div>
                <div class="value">${escapeHtml(node.zone || "-")}</div>
              </div>
              <div class="kv">
                <div class="key">数量来源</div>
                <div class="value">${escapeHtml(node.vm_count_source || "-")}</div>
              </div>
              <div class="kv">
                <div class="key">更新时间</div>
                <div class="value">${escapeHtml(node.service?.updated_at || "-")}</div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderApiError(error) {
      setBadge(el("apiBadge"), "bad", "API 未连接");
      setBadge(el("summaryBadge"), "warn", "等待实时 API");
      el("apiNotice").classList.add("show");
      el("lastUpdate").textContent = `失败 ${new Date().toLocaleTimeString()}`;
      el("nodeGrid").innerHTML = `
        <div class="panel">无法读取实时状态：${escapeHtml(error.message)}</div>
      `;
    }

    async function refreshStatus() {
      try {
        const response = await fetch(`/api/status?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        render(await response.json());
      } catch (error) {
        renderApiError(error);
      }
    }

    function startTimer() {
      if (state.timerId) {
        window.clearInterval(state.timerId);
      }
      const seconds = Number(el("refreshInterval").value || 5);
      state.timerId = window.setInterval(refreshStatus, seconds * 1000);
    }

    el("refreshNow").addEventListener("click", refreshStatus);
    el("refreshInterval").addEventListener("change", () => {
      localStorage.setItem("trustMonitorRefreshSeconds", el("refreshInterval").value);
      startTimer();
    });
    el("nodeGrid").addEventListener("click", (event) => {
      const card = event.target.closest(".node-card");
      if (!card) return;
      const host = card.dataset.host;
      if (state.expandedHosts.has(host)) {
        state.expandedHosts.delete(host);
      } else {
        state.expandedHosts.add(host);
      }
      card.classList.toggle("expanded");
      card.setAttribute("aria-expanded", String(state.expandedHosts.has(host)));
      const mark = card.querySelector(".expand-mark");
      if (mark) {
        mark.textContent = state.expandedHosts.has(host) ? "收起" : "详情";
      }
    });
    el("nodeGrid").addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const card = event.target.closest(".node-card");
      if (!card) return;
      event.preventDefault();
      card.click();
    });

    const savedInterval = localStorage.getItem("trustMonitorRefreshSeconds");
    if (savedInterval) {
      el("refreshInterval").value = savedInterval;
    }

    refreshStatus();
    startTimer();
  </script>
</body>
</html>
