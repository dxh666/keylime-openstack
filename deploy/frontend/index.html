<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keylime OpenStack 可信管理</title>
  <style>[v-cloak]{display:none!important}</style>
  <link rel="stylesheet" href="styles.css?v=20260723-trusted-boot">
</head>
<body>
  <div id="app" v-cloak :class="{ 'login-app': authChecked && !authenticated, 'booting-app': !authChecked }">
    <section v-if="!authChecked" class="auth-boot-screen" aria-hidden="true"></section>

    <section v-else-if="!authenticated" class="login-screen">
      <div class="login-shell">
        <form class="login-panel" @submit.prevent="loginSession">
          <div class="login-panel-head">
            <h1>安全管理中心</h1>
          </div>
          <label class="login-field">
            <span>用户名</span>
            <input v-model.trim="loginForm.username" type="text" autocomplete="username" required autofocus>
          </label>
          <label class="login-field">
            <span>密码</span>
            <input v-model="loginForm.password" type="password" autocomplete="current-password" required>
          </label>
          <p v-if="loginError" class="login-error">{{ loginError }}</p>
          <button class="primary login-submit" type="submit" :disabled="busy">
            {{ busy ? '登录中' : '登录' }}
          </button>
        </form>
      </div>
    </section>

    <template v-else>
    <aside class="sidebar">
      <div class="brand">
        <strong>可信云管理平台</strong>
        <span>Keylime OpenStack</span>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item" :class="{ active: view === 'dashboard' }" @click="selectView('dashboard')">首页</button>

        <div class="nav-group" :class="{ active: groupActive('nodes') }">
          <button class="nav-parent" type="button" @click="toggleGroup('nodes')">
            <span>节点管理</span>
            <span class="chevron">{{ expandedGroups.nodes ? '收起' : '展开' }}</span>
          </button>
          <div v-show="expandedGroups.nodes" class="nav-children">
            <button class="nav-subitem" :class="{ active: view === 'control_nodes' }" @click="selectView('control_nodes')">控制节点</button>
            <button class="nav-subitem" :class="{ active: view === 'compute_nodes' }" @click="selectView('compute_nodes')">计算节点</button>
          </div>
        </div>

        <div class="nav-group" :class="{ active: groupActive('policies') }">
          <button class="nav-parent" type="button" @click="toggleGroup('policies')">
            <span>策略管理</span>
            <span class="chevron">{{ expandedGroups.policies ? '收起' : '展开' }}</span>
          </button>
          <div v-show="expandedGroups.policies" class="nav-children">
            <button
              v-for="item in policyTypes"
              :key="item.key"
              class="nav-subitem"
              :class="{ active: view === 'policies' && activePolicyType === item.key }"
              @click="selectPolicyType(item.key)"
            >
              {{ item.label }}
            </button>
            <button class="nav-subitem nav-subparent" type="button" @click="toggleGroup('dynamic_policies')">
              <span>动态度量策略</span>
              <span class="chevron">{{ expandedGroups.dynamic_policies ? '收起' : '展开' }}</span>
            </button>
            <div v-show="expandedGroups.dynamic_policies" class="nav-grandchildren">
              <button
                class="nav-thirditem"
                :class="{ active: view === 'environment_dynamic_policy' }"
                @click="selectEnvironmentDynamicPolicy"
              >
                环境动态度量策略
              </button>
            </div>
          </div>
        </div>

        <button class="nav-item" :class="{ active: view === 'global_policy' }" @click="selectView('global_policy')">全局策略控制</button>
        <button class="nav-item" :class="{ active: view === 'alerts' }" @click="selectView('alerts')">告警中心</button>
        <button class="nav-item" :class="{ active: view === 'tasks' }" @click="selectView('tasks')">任务中心</button>
        <button class="nav-item" :class="{ active: view === 'audit' }" @click="selectView('audit')">审计日志</button>
      </nav>

      <div class="sidebar-footer">
        <span>Keylime OpenStack</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>{{ currentTitle }}</h1>
        </div>
        <div class="topbar-actions">
          <span class="system-clock">{{ currentTimeText }}</span>
          <div class="topbar-toolbox" aria-label="用户工具">
            <div class="user-menu-wrap">
              <button
                type="button"
                class="toolbar-button user-menu-button"
                aria-haspopup="true"
                :aria-expanded="userMenuOpen ? 'true' : 'false'"
                @click.stop="toggleUserMenu"
              >
                <span class="toolbar-icon user-avatar" aria-hidden="true"></span>
                <span>{{ currentUserName }}</span>
              </button>
              <div v-if="userMenuOpen" class="user-menu-panel" @click.stop>
                <span class="user-menu-caret" aria-hidden="true"></span>
                <div class="user-profile">
                  <div class="user-profile-avatar">
                    <span class="user-profile-icon" aria-hidden="true"></span>
                  </div>
                  <div class="user-profile-name">{{ currentUserName }} - 管理员</div>
                </div>
                <div class="user-menu-footer">
                  <button type="button" class="logout-button" @click="logoutSession">注销</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <section v-if="notice.text" :class="['notice', notice.kind]">{{ notice.text }}</section>

      <section v-if="view === 'dashboard'" class="screen">
        <div class="screen-toolbar">
          <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
        </div>
        <section class="dashboard-grid">
          <article class="panel control-info">
            <div class="panel-head">
              <h2>控制节点信息</h2>
            </div>
            <div class="info-grid">
              <div v-for="item in controlNodeInfo" :key="item.label">
                <span>{{ item.label }}</span>
                <strong>{{ item.value }}</strong>
              </div>
            </div>
          </article>

          <article class="panel">
            <div class="panel-head">
              <h2>控制节点运行状况</h2>
            </div>
            <div class="component-list">
              <div v-for="item in controlRuntimeItems" :key="item.name">
                <span>{{ item.name }}</span>
                <em :class="['pill', item.state]">{{ item.status }}</em>
              </div>
            </div>
          </article>

          <article class="panel">
            <div class="panel-head">
              <h2>在线用户信息</h2>
            </div>
            <div class="table compact-table online-user-table">
              <div class="row header">
                <span>类型</span><span>用户名</span><span>用户组</span><span>IP 地址</span>
              </div>
              <div v-for="user in onlineUsers" :key="`${user.username}-${user.ip_address}`" class="row">
                <span>{{ user.type }}</span>
                <span>{{ user.username }}</span>
                <span>{{ user.user_group }}</span>
                <span>{{ user.ip_address }}</span>
              </div>
            </div>
          </article>
        </section>

        <div class="summary-grid">
          <article v-for="item in dashboardSummary" :key="item.label" class="metric" :class="item.state">
            <span>{{ item.label }}</span>
            <strong>{{ item.value }}</strong>
          </article>
        </div>

        <section class="panel">
          <div class="panel-head">
            <h2>OpenStack 计算服务状态</h2>
          </div>
          <div class="table compact-table dashboard-compute-table">
            <div class="row header">
              <span>节点名称</span><span>管理节点 IP</span><span>自身 IP</span><span>计算服务状态</span><span>可信状态</span><span>最近证明时间</span>
            </div>
            <div v-for="node in computeRows" :key="node.id" class="row">
              <span>{{ node.host }}</span>
              <span>{{ node.managementIp }}</span>
              <span>{{ node.ownIp }}</span>
              <span><em :class="['pill', node.openstackClass]">{{ node.openstackText }}</em></span>
              <span><em :class="['pill', node.trustClass]">{{ node.trustText }}</em></span>
              <span>{{ node.attestationTime }}</span>
            </div>
          </div>
          <p v-if="!computeRows.length" class="empty">暂无计算节点。</p>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>近期事件日志</h2>
          </div>
          <div class="table compact-table event-table">
            <div class="row header">
              <span>时间</span><span>级别</span><span>对象</span><span>事件内容</span>
            </div>
            <div v-for="event in recentEvents" :key="`${event.time}-${event.target}-${event.message}`" class="row">
              <span>{{ formatTime(event.time) }}</span>
              <span><em :class="['pill', event.state]">{{ event.severity }}</em></span>
              <span>{{ event.target }}</span>
              <span>{{ event.message }}</span>
            </div>
          </div>
          <p v-if="!recentEvents.length" class="empty">暂无事件。</p>
        </section>
      </section>

      <section v-if="view === 'control_nodes'" class="screen">
        <section class="panel">
          <div class="panel-head">
            <h2>控制节点</h2>
            <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
          </div>
          <div class="table compact-table control-table">
            <div class="row header">
              <span>节点名称</span><span>IP 地址</span><span>操作系统</span><span>CPU</span><span>状态</span><span>操作</span>
            </div>
            <div v-for="node in controllerNodes" :key="node.id" class="row">
              <span>{{ node.hostname }}</span>
              <span>{{ node.management_ip || '-' }}</span>
              <span>{{ nodeOsText(node) }}</span>
              <span>{{ nodeCpuText(node) }}</span>
              <span><em class="pill ok">在线</em></span>
              <span class="row-actions">
                <button type="button" class="small" @click="openControllerDetail(node)">查看详情</button>
                <button type="button" class="small" :disabled="busy" @click="refreshNodeStatus">刷新状态</button>
              </span>
            </div>
          </div>
        </section>
      </section>

      <section v-if="view === 'compute_nodes'" class="screen">
        <section class="panel">
          <div class="panel-head">
            <h2>计算节点</h2>
            <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
            <button type="button" :disabled="busy" @click="syncTrustRegistrations">同步纳管</button>
          </div>
          <div class="table compact-table node-compute-table">
            <div class="row header">
              <span>节点名称</span><span>管理节点 IP</span><span>自身 IP</span><span>计算服务状态</span><span>可信代理</span><span>可信根/能力</span><span>可信状态</span><span>最近验证</span><span>操作</span>
            </div>
            <div v-for="node in computeRows" :key="node.id" class="row">
              <span>{{ node.host }}</span>
              <span>{{ node.managementIp }}</span>
              <span>{{ node.ownIp }}</span>
              <span><em :class="['pill', node.openstackClass]">{{ node.openstackText }}</em></span>
              <span><em :class="['pill', node.managedClass]">{{ node.managed }}</em></span>
              <span class="trust-capability-cell">
                <strong>{{ node.trustedRoot }}</strong>
                <small>{{ node.capabilityText }}</small>
              </span>
              <span><em :class="['pill', node.trustClass]">{{ node.trustText }}</em></span>
              <span>{{ node.attestationTime }}</span>
              <span class="row-actions">
                <button type="button" class="small" @click="openComputeDetail(node)">查看详情</button>
                <button type="button" class="small" :disabled="busy" @click="openTrustProfileDialog(node)">纳管配置</button>
                <button v-if="node.trustManaged" type="button" class="small" :disabled="busy" @click="verifyComputeNodeTrust(node)">验证</button>
                <button
                  v-if="node.canCollectTpcmDynamic"
                  type="button"
                  class="small"
                  :disabled="busy"
                  @click="runOpenTcsmAccessCheck(node)"
                >
                  接入检查
                </button>
              </span>
            </div>
          </div>
        </section>
      </section>

      <section v-if="view === 'policies'" class="screen">
        <section class="panel">
          <div class="panel-head">
            <h2>{{ currentPolicyType.label }}</h2>
            <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
            <button
              class="primary"
              type="button"
              :disabled="!currentPolicyType.creatable"
              @click="openCreatePolicy"
            >
              新增策略
            </button>
          </div>
          <div class="table policy-table">
            <div class="row header">
              <span>策略名称</span><span>节点范围</span><span>生效状态</span><span>生效版本</span><span>操作</span>
            </div>
            <div v-for="policy in filteredPolicies" :key="policy.id" class="row">
              <span>{{ policy.name }}</span>
              <span>{{ bindingNames(policy) }}</span>
              <span>
                <em :class="['pill', deploymentClass(bindingState(policy))]">{{ bindingStateText(policy) }}</em>
              </span>
              <span>{{ policyEffectiveVersion(policy) }}</span>
              <span class="row-actions">
                <button type="button" @click="viewPolicy(policy)">查看</button>
                <button type="button" @click="deployPolicy(policy)">{{ deployActionText(policy) }}</button>
                <button class="danger" type="button" @click="deletePolicy(policy)">删除</button>
              </span>
            </div>
          </div>
          <p v-if="!filteredPolicies.length" class="empty">暂无策略。</p>
        </section>
      </section>

      <section v-if="view === 'environment_dynamic_policy'" class="screen">
        <div class="screen-toolbar">
          <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
        </div>
        <section class="dynamic-policy-layout">
          <section class="panel dynamic-node-panel">
            <div class="panel-head">
              <h2>节点策略列表</h2>
              <div class="dynamic-node-tools">
                <input v-model="dynamicNodeSearch" type="search" placeholder="搜索节点或 IP">
                <select v-model="dynamicNodeStatusFilter">
                  <option value="all">全部状态</option>
                  <option value="applied">一致</option>
                  <option value="queued">待生效</option>
                  <option value="applying">生效中</option>
                  <option value="global_disabled">暂不生效</option>
                  <option value="failed">生效失败</option>
                  <option value="not_configured">未配置</option>
                  <option value="auth_error">授权异常</option>
                </select>
              </div>
            </div>
            <div class="table compact-table dynamic-node-table">
              <div class="row header">
                <span>节点名称</span><span>管理 IP</span><span>节点总开关</span><span>策略状态</span><span>最近生效时间</span>
              </div>
              <button
                v-for="node in filteredDynamicNodeRows"
                :key="node.id"
                type="button"
                class="row dynamic-node-row"
                :class="{ active: node.selected }"
                @click="selectDynamicNode(node)"
              >
                <strong>{{ node.hostname }}</strong>
                <span>{{ node.ip }}</span>
                <span><em :class="['pill', node.nodeSwitchClass]">{{ node.nodeSwitchText }}</em></span>
                <span><em :class="['pill', node.stateClass]">{{ node.stateText }}</em></span>
                <span>{{ node.effectiveAt }}</span>
              </button>
            </div>
            <p v-if="!filteredDynamicNodeRows.length" class="empty">暂无匹配节点。</p>
          </section>

          <section class="panel dynamic-policy-panel">
            <div class="panel-head">
              <div>
                <h2>环境动态度量策略</h2>
                <p>{{ selectedDynamicNode ? selectedDynamicNode.hostname : '未选择节点' }}</p>
              </div>
              <div class="dynamic-actions">
                <button type="button" :disabled="busy || !selectedDynamicNode" @click="refreshSelectedDynamicNode">
                  刷新状态
                </button>
                <button class="primary" type="button" :disabled="busy || !selectedDynamicNode" @click="saveDynamicMeasurementConfig">
                  {{ tpcmDynamicGlobalEnabled ? '保存并生效' : '保存配置' }}
                </button>
              </div>
            </div>
            <div class="dynamic-node-switch">
              <div>
                <strong>节点动态度量总开关</strong>
                <span>关闭后，该节点所有环境动态度量对象均不生效，已有对象配置保留。</span>
              </div>
              <label class="inline-switch">
                <input
                  v-model="dynamicForm.nodeEnabled"
                  type="checkbox"
                  :disabled="!selectedDynamicNode"
                  @change="markDynamicFormDirty"
                >
                <em :class="['switch', dynamicForm.nodeEnabled ? 'on' : 'off']"></em>
                <strong>{{ dynamicForm.nodeEnabled ? '开启' : '关闭' }}</strong>
              </label>
            </div>
            <div class="info-grid dynamic-status-grid">
              <div v-for="item in dynamicStatusItems" :key="item.label">
                <span>{{ item.label }}</span>
                <strong>
                  <em v-if="item.state" :class="['pill', item.state]">{{ item.value }}</em>
                  <template v-else>{{ item.value }}</template>
                </strong>
              </div>
            </div>
            <div class="table dynamic-object-table">
              <div class="row header">
                <span>度量对象</span><span>当前状态</span><span>当前周期</span><span>目标状态</span><span>目标周期</span><span>生效状态</span>
              </div>
              <div v-for="item in dynamicObjectRows" :key="item.key" class="row">
                <span>{{ item.label }}</span>
                <span><em :class="['pill', item.currentClass]">{{ item.currentText }}</em></span>
                <span>{{ item.currentIntervalText }}</span>
                <span>
                  <label class="inline-switch">
                    <input
                      v-model="dynamicForm.objects[item.key].enabled"
                      type="checkbox"
                      :disabled="!selectedDynamicNode || !dynamicForm.nodeEnabled"
                      @change="markDynamicFormDirty"
                    >
                    <em :class="['switch', dynamicForm.objects[item.key].enabled ? 'on' : 'off']"></em>
                    <strong>{{ dynamicForm.objects[item.key].enabled ? '开启' : '关闭' }}</strong>
                  </label>
                </span>
                <span>
                  <input
                    v-model.number="dynamicForm.objects[item.key].intervalMilli"
                    class="inline-number"
                    type="number"
                    min="1000"
                    max="86400000"
                    step="1000"
                    :disabled="!selectedDynamicNode || !dynamicForm.nodeEnabled || !dynamicForm.objects[item.key].enabled"
                    @input="markDynamicFormDirty"
                  >
                  <small>毫秒</small>
                </span>
                <span><em :class="['pill', item.stateClass]">{{ item.stateText }}</em></span>
              </div>
            </div>
          </section>
        </section>
      </section>

      <section v-if="view === 'global_policy'" class="screen">
        <section class="panel">
          <div class="panel-head">
            <h2>全局策略控制</h2>
            <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
          </div>
          <div class="switch-grid">
            <article v-for="item in trustCapabilityItems" :key="item.key" class="switch-item">
              <div>
                <strong>{{ item.label }}</strong>
                <span>{{ item.summary || (item.enabled ? '已参与可信判定' : '未参与可信判定') }}</span>
              </div>
              <button
                v-if="item.actionable"
                type="button"
                class="switch-control"
                :disabled="busy"
                @click="toggleGlobalTrustCapability(item)"
              >
                <em :class="['switch', item.enabled ? 'on' : 'off']"></em>
                <span>{{ item.enabled ? '关闭' : '开启' }}</span>
              </button>
              <em v-else :class="['switch', item.enabled ? 'on' : 'off']"></em>
            </article>
          </div>
        </section>
      </section>

      <section v-if="view === 'alerts'" class="screen">
        <section class="panel">
          <div class="panel-head">
            <h2>告警中心</h2>
            <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
          </div>
          <div class="list-toolbar">
            <span>共 {{ alertPageInfo.total }} 条，显示 {{ alertPageInfo.start }}-{{ alertPageInfo.end }} 条</span>
            <label class="page-size-control">
              <span>每页</span>
              <select :value="listPagination.alerts.pageSize" @change="changeListPageSize('alerts', $event.target.value)">
                <option v-for="size in listPageSizes" :key="`alerts-${size}`" :value="size">{{ size }}</option>
              </select>
            </label>
          </div>
          <div class="table compact-table alert-table">
            <div class="row header">
              <span>对象</span><span>级别</span><span>事件内容</span><span>处置建议</span>
            </div>
            <div v-for="item in paginatedAlertRows" :key="`${item.target}-${item.message}`" class="row">
              <span>{{ item.target }}</span>
              <span><em :class="['pill', item.state]">{{ item.severity }}</em></span>
              <span>{{ item.message }}</span>
              <span>{{ item.remediation }}</span>
            </div>
          </div>
          <div v-if="alertPageInfo.total" class="pager">
            <button type="button" class="small" :disabled="!alertPageInfo.hasPrev" @click="changeListPage('alerts', 1)">首页</button>
            <button type="button" class="small" :disabled="!alertPageInfo.hasPrev" @click="changeListPage('alerts', alertPageInfo.page - 1)">上一页</button>
            <span>第 {{ alertPageInfo.page }} 页 / 共 {{ alertPageInfo.totalPages }} 页</span>
            <button type="button" class="small" :disabled="!alertPageInfo.hasNext" @click="changeListPage('alerts', alertPageInfo.page + 1)">下一页</button>
            <button type="button" class="small" :disabled="!alertPageInfo.hasNext" @click="changeListPage('alerts', alertPageInfo.totalPages)">末页</button>
          </div>
          <p v-if="!alertPageInfo.total" class="empty">暂无告警。</p>
        </section>
      </section>

      <section v-if="view === 'tasks'" class="screen">
        <section class="panel">
          <div class="panel-head">
            <h2>任务中心</h2>
            <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
          </div>
          <div class="list-toolbar">
            <span>共 {{ taskPageInfo.total }} 条，显示 {{ taskPageInfo.start }}-{{ taskPageInfo.end }} 条</span>
            <label class="page-size-control">
              <span>每页</span>
              <select :value="listPagination.tasks.pageSize" @change="changeListPageSize('tasks', $event.target.value)">
                <option v-for="size in listPageSizes" :key="`tasks-${size}`" :value="size">{{ size }}</option>
              </select>
            </label>
          </div>
          <div class="table compact-table task-table">
            <div class="row header">
              <span>任务类型</span><span>对象</span><span>状态</span><span>说明</span><span>开始时间</span><span>结束时间</span>
            </div>
            <div v-for="task in paginatedVisibleTasks" :key="task.id" class="row">
              <span>{{ taskTypeText(task.task_type) }}</span>
              <span>{{ taskTargetText(task) }}</span>
              <span><em :class="['pill', taskSeverityClass(task.status)]">{{ taskStatusText(task.status) }}</em></span>
              <span>{{ taskSummaryText(task) }}</span>
              <span>{{ formatTime(task.started_at) }}</span>
              <span>{{ formatTime(task.finished_at) }}</span>
            </div>
          </div>
          <div v-if="taskPageInfo.total" class="pager">
            <button type="button" class="small" :disabled="!taskPageInfo.hasPrev" @click="changeListPage('tasks', 1)">首页</button>
            <button type="button" class="small" :disabled="!taskPageInfo.hasPrev" @click="changeListPage('tasks', taskPageInfo.page - 1)">上一页</button>
            <span>第 {{ taskPageInfo.page }} 页 / 共 {{ taskPageInfo.totalPages }} 页</span>
            <button type="button" class="small" :disabled="!taskPageInfo.hasNext" @click="changeListPage('tasks', taskPageInfo.page + 1)">下一页</button>
            <button type="button" class="small" :disabled="!taskPageInfo.hasNext" @click="changeListPage('tasks', taskPageInfo.totalPages)">末页</button>
          </div>
          <p v-if="!taskPageInfo.total" class="empty">暂无需要关注的任务。</p>
        </section>
      </section>

      <section v-if="view === 'audit'" class="screen">
        <section class="panel">
          <div class="panel-head">
            <h2>审计日志</h2>
            <button type="button" class="page-refresh-button" :disabled="busy" @click="refreshCurrentView(true)">刷新</button>
          </div>
          <div class="audit-tabs" role="tablist" aria-label="审计日志分类">
            <button
              v-for="tab in auditCategoryTabs"
              :key="tab.key"
              type="button"
              :class="{ active: activeAuditCategory === tab.key }"
              @click="selectAuditCategory(tab.key)"
            >
              <span>{{ tab.label }}</span>
              <em>{{ tab.count }}</em>
            </button>
          </div>
          <div class="list-toolbar">
            <span>共 {{ auditPageInfo.total }} 条，显示 {{ auditPageInfo.start }}-{{ auditPageInfo.end }} 条</span>
            <label class="page-size-control">
              <span>每页</span>
              <select :value="listPagination.audit.pageSize" @change="changeListPageSize('audit', $event.target.value)">
                <option v-for="size in listPageSizes" :key="`audit-${size}`" :value="size">{{ size }}</option>
              </select>
            </label>
          </div>
          <div class="table compact-table audit-table">
            <div class="row header">
              <span>时间</span><span>日志类型</span><span>主体名称</span><span>客体名称</span><span>摘要</span><span>操作</span><span>结果</span>
            </div>
            <div v-for="event in paginatedAuditEvents" :key="event.id" class="row">
              <span>{{ formatTime(event.created_at) }}</span>
              <span>{{ auditType(event) }}</span>
              <span>{{ auditSubject(event) }}</span>
              <span>{{ auditObject(event) }}</span>
              <span class="audit-hash" :title="auditSummary(event)">{{ auditSummaryText(event) }}</span>
              <span>{{ auditOperation(event) }}</span>
              <span><em :class="['pill', auditResultClass(event)]">{{ auditResult(event) }}</em></span>
            </div>
          </div>
          <div v-if="auditPageInfo.total" class="pager">
            <button type="button" class="small" :disabled="!auditPageInfo.hasPrev" @click="changeListPage('audit', 1)">首页</button>
            <button type="button" class="small" :disabled="!auditPageInfo.hasPrev" @click="changeListPage('audit', auditPageInfo.page - 1)">上一页</button>
            <span>第 {{ auditPageInfo.page }} 页 / 共 {{ auditPageInfo.totalPages }} 页</span>
            <button type="button" class="small" :disabled="!auditPageInfo.hasNext" @click="changeListPage('audit', auditPageInfo.page + 1)">下一页</button>
            <button type="button" class="small" :disabled="!auditPageInfo.hasNext" @click="changeListPage('audit', auditPageInfo.totalPages)">末页</button>
          </div>
          <p v-if="!auditPageInfo.total" class="empty">暂无审计日志。</p>
        </section>
      </section>

      <div v-if="createDialogOpen" class="modal-backdrop" @click.self="closeCreatePolicy">
        <section class="modal modal-wide policy-create-dialog" role="dialog" aria-modal="true">
          <h2>新增{{ currentPolicyType.label }}</h2>
          <form class="policy-form" @submit.prevent="createPolicy">
            <label>
              <span>策略名称</span>
              <input v-model="createForm.name" required :placeholder="policyNamePlaceholder">
            </label>
            <label class="wide">
              <span>描述</span>
              <input v-model="createForm.description" placeholder="简要说明策略用途">
            </label>
            <fieldset v-if="activePolicyType === 'measured_boot'" class="wide segmented-field">
              <legend>适用可信根</legend>
              <label class="check-option compact-option">
                <input
                  :checked="createForm.trustedRootType === 'tpm'"
                  type="radio"
                  name="trusted-boot-root"
                  value="tpm"
                  @change="changeTrustedBootRootType('tpm')"
                >
                <span>TPM 可信启动</span>
              </label>
              <label class="check-option compact-option">
                <input
                  :checked="createForm.trustedRootType === 'tpcm'"
                  type="radio"
                  name="trusted-boot-root"
                  value="tpcm"
                  @change="changeTrustedBootRootType('tpcm')"
                >
                <span>TPCM 可信启动</span>
              </label>
            </fieldset>
            <fieldset class="wide target-selector">
              <legend>目标节点</legend>
              <label v-for="node in policyTargetNodes" :key="node.id" class="check-option">
                <input v-model="createForm.targetNodeIds" type="checkbox" :value="node.id">
                <span>{{ node.hostname }}</span>
                <small>{{ node.management_ip || node.keylime_agent_ip }}</small>
              </label>
              <p v-if="!policyTargetNodes.length" class="empty">暂无可选目标节点。</p>
            </fieldset>
            <template v-if="activePolicyType === 'measured_boot' && createForm.trustedRootType !== 'tpcm'">
              <fieldset class="wide pcr-selector">
                <legend>TPM PCR 范围</legend>
                <label v-for="pcr in [0,1,2,3,4,5,6,7]" :key="pcr" class="check-option compact-option">
                  <input v-model="createForm.pcrs" type="checkbox" :value="pcr">
                  <span>PCR {{ pcr }}</span>
                </label>
              </fieldset>
              <label class="wide toggle-line">
                <input v-model="createForm.secureBootRequired" type="checkbox">
                <span>要求 Secure Boot 已启用</span>
              </label>
            </template>
            <template v-if="activePolicyType === 'measured_boot' && createForm.trustedRootType === 'tpcm'">
              <div class="wide info-note">
                TPCM 可信启动将从当前 OpenTCSM 证据采集启动记录并绑定管理侧基线；未配置授权材料时不会写入 TPCM 启动参考值。
              </div>
              <label>
                <span>最少启动参考值</span>
                <input v-model.number="createForm.tpcmMinimumBootReferences" type="number" min="0" max="100000">
              </label>
              <label class="wide toggle-line">
                <input v-model="createForm.tpcmRequireCleanTrustReport" type="checkbox">
                <span>要求 TPCM 可信报告无失败项</span>
              </label>
              <label class="wide toggle-line">
                <input v-model="createForm.tpcmWriteEnabled" type="checkbox">
                <span>预留 TPCM 启动参考值写入能力</span>
              </label>
              <label v-if="createForm.tpcmWriteEnabled">
                <span>授权材料引用</span>
                <input v-model="createForm.tpcmAuthRef" placeholder="bmeasure-uid">
              </label>
            </template>

            <template v-if="activePolicyType === 'ima_runtime'">
              <label class="wide">
                <span>节点 IMA 度量策略</span>
                <textarea v-model="createForm.nodeImaPolicy" rows="12" spellcheck="false"></textarea>
              </label>
              <label class="wide">
                <span>Keylime 排除规则</span>
                <textarea v-model="createForm.excludesText" rows="7" spellcheck="false"></textarea>
              </label>
              <label class="wide toggle-line">
                <input v-model="createForm.rebootAfterApply" type="checkbox">
                <span>在维护窗口内自动重启目标节点</span>
              </label>
            </template>

            <div class="form-actions">
              <button type="button" :disabled="busy" @click="closeCreatePolicy">取消</button>
              <button class="primary" type="submit" :disabled="busy">生成并下发策略</button>
            </div>
          </form>
        </section>
      </div>

      <div v-if="detailPolicy" class="modal-backdrop" @click.self="closePolicyDetail">
        <section class="modal modal-wide" role="dialog" aria-modal="true">
          <h2>策略详情</h2>
          <div class="detail-grid">
            <div><span>名称</span><strong>{{ detailPolicy.name }}</strong></div>
            <div><span>类型</span><strong>{{ currentPolicyType.label }}</strong></div>
            <div><span>版本</span><strong>v{{ detailPolicy.version }}</strong></div>
            <div><span>状态</span><strong>{{ statusText(detailPolicy.status) }}</strong></div>
            <div><span>哈希算法</span><strong>{{ detailPolicy.hash_alg }}</strong></div>
            <div><span>描述</span><strong>{{ detailPolicy.description || '-' }}</strong></div>
          </div>
          <section class="detail-block">
            <h3>目标节点</h3>
            <div class="binding-list">
              <div v-for="binding in detailPolicy.bindings || []" :key="binding.id">
                <strong>{{ binding.target_name }}</strong>
                <span :class="['pill', deploymentClass(binding.application_status)]">
                  {{ deploymentText(binding.application_status) }}
                </span>
                <small>可信代理对象：{{ binding.external_policy_name || '-' }}</small>
                <small>生效时间：{{ formatTime(binding.applied_at) }}</small>
                <small>证据：{{ bindingEvidenceText(binding) }}</small>
                <small v-if="binding.last_error" class="error-text">{{ binding.last_error }}</small>
                <button type="button" class="small" @click="deployPolicy(detailPolicy, binding)">{{ deployActionText(detailPolicy, 'node') }}</button>
              </div>
            </div>
          </section>
          <section v-if="detailPolicy.policy_type === 'measured_boot'" class="detail-block">
            <h3>可信启动规则</h3>
            <div class="detail-grid">
              <div><span>可信根</span><strong>{{ policyTrustedRootText(detailPolicy) }}</strong></div>
              <div v-if="detailPolicy.content.trusted_root_type !== 'tpcm'"><span>PCR 范围</span><strong>{{ policyPcrText(detailPolicy) }}</strong></div>
              <div v-if="detailPolicy.content.trusted_root_type !== 'tpcm'"><span>兼容校验</span><strong>{{ policyFallbackPcrText(detailPolicy) }}</strong></div>
              <div v-if="detailPolicy.content.trusted_root_type !== 'tpcm'"><span>Secure Boot</span><strong>{{ policySecureBootText(detailPolicy) }}</strong></div>
              <div v-if="detailPolicy.content.trusted_root_type === 'tpcm'"><span>应用方式</span><strong>{{ policyTpcmBootModeText(detailPolicy) }}</strong></div>
              <div v-if="detailPolicy.content.trusted_root_type === 'tpcm'"><span>启动参考值要求</span><strong>{{ policyTpcmBootBaselineText(detailPolicy) }}</strong></div>
              <div><span>可信代理对象</span><strong>{{ policyArtifactText(detailPolicy) }}</strong></div>
            </div>
          </section>
          <section v-if="detailPolicy.policy_type === 'ima_runtime'" class="detail-block">
            <h3>排除规则</h3>
            <pre>{{ listText(detailPolicy.excludes) }}</pre>
          </section>
          <section v-if="detailPolicy.policy_type === 'tpcm_dynamic_measurement'" class="detail-block">
            <h3>动态度量规则</h3>
            <div class="detail-grid">
              <div><span>度量对象</span><strong>{{ policyDynamicObjectsText(detailPolicy) }}</strong></div>
              <div><span>检测周期</span><strong>{{ policyDynamicIntervalText(detailPolicy) }}</strong></div>
              <div><span>生效状态</span><strong>{{ bindingStateText(detailPolicy) }}</strong></div>
            </div>
          </section>
          <section class="detail-block">
            <h3>策略内容</h3>
            <pre>{{ prettyJson(detailPolicy.content) }}</pre>
          </section>
          <div class="modal-actions">
            <button type="button" @click="closePolicyDetail">关闭</button>
            <button
              class="primary"
              type="button"
              @click="deployPolicy(detailPolicy)"
            >
              {{ deployActionText(detailPolicy, 'all') }}
            </button>
          </div>
        </section>
      </div>

      <div v-if="trustProfileDialog.open" class="modal-backdrop" @click.self="closeTrustProfileDialog">
        <section class="modal modal-wide trust-profile-dialog" role="dialog" aria-modal="true">
          <h2>可信节点纳管配置</h2>
          <form class="policy-form trust-profile-form" @submit.prevent="saveTrustProfile">
            <label>
              <span>节点名称</span>
              <input v-model="trustProfileDialog.form.hostname" required readonly>
            </label>
            <label>
              <span>OpenStack 计算名称</span>
              <input v-model="trustProfileDialog.form.openstackComputeName" placeholder="如 hygon23">
            </label>
            <label>
              <span>管理 IP</span>
              <input v-model="trustProfileDialog.form.managementIp" placeholder="如 172.31.100.23">
            </label>
            <label class="toggle-line">
              <input v-model="trustProfileDialog.form.isOpenStackCompute" type="checkbox">
              <span>OpenStack 计算节点</span>
            </label>
            <label class="toggle-line">
              <input
                v-model="trustProfileDialog.form.trustManaged"
                type="checkbox"
                @change="syncTrustProfileCapabilityDefaults"
              >
              <span>纳入可信代理管理</span>
            </label>
            <label>
              <span>可信根类型</span>
              <select
                v-model="trustProfileDialog.form.trustedRootType"
                :disabled="!trustProfileDialog.form.trustManaged"
                @change="syncTrustProfileCapabilityDefaults"
              >
                <option value="unknown">unknown</option>
                <option value="tpm">TPM</option>
                <option value="tpcm">TPCM</option>
              </select>
            </label>
            <template v-if="trustProfileDialog.form.trustManaged">
              <label>
                <span>可信代理地址</span>
                <input v-model="trustProfileDialog.form.agentHost" required placeholder="节点管理 IP 或代理地址">
              </label>
              <label v-if="trustProfileDialog.form.trustedRootType === 'tpm'">
                <span>可信代理端口</span>
                <input v-model.number="trustProfileDialog.form.agentPort" type="number" min="1" max="65535">
              </label>
              <label v-if="trustProfileDialog.form.trustedRootType === 'tpcm'">
                <span>通信方式</span>
                <select v-model="trustProfileDialog.form.agentTransport">
                  <option value="ssh">SSH</option>
                </select>
              </label>
              <label v-if="trustProfileDialog.form.trustedRootType === 'tpm'" class="wide">
                <span>TPM 代理 UUID</span>
                <input v-model="trustProfileDialog.form.tpmAgentUuid" placeholder="可由同步纳管补齐">
              </label>
              <label v-if="trustProfileDialog.form.trustedRootType === 'tpcm'" class="wide">
                <span>TPCM 标识</span>
                <input v-model="trustProfileDialog.form.tpcmId" placeholder="可由证据采集补齐">
              </label>
            </template>
            <fieldset class="wide target-selector trust-capability-selector">
              <legend>可信能力</legend>
              <label class="check-option compact-option">
                <input
                  v-model="trustProfileDialog.form.capabilities.trustedBoot"
                  type="checkbox"
                  :disabled="!trustProfileDialog.form.trustManaged"
                >
                <span>可信启动</span>
              </label>
              <label class="check-option compact-option">
                <input
                  v-model="trustProfileDialog.form.capabilities.imaRuntime"
                  type="checkbox"
                  :disabled="!trustProfileDialog.form.trustManaged || trustProfileDialog.form.trustedRootType !== 'tpm'"
                >
                <span>IMA 运行时</span>
              </label>
              <label class="check-option compact-option">
                <input
                  v-model="trustProfileDialog.form.capabilities.tpcmDynamicMeasurement"
                  type="checkbox"
                  :disabled="!trustProfileDialog.form.trustManaged || trustProfileDialog.form.trustedRootType !== 'tpcm'"
                >
                <span>TPCM 动态度量</span>
              </label>
            </fieldset>
            <div class="form-actions">
              <button type="button" :disabled="busy" @click="closeTrustProfileDialog">取消</button>
              <button class="primary" type="submit" :disabled="busy">保存配置</button>
            </div>
          </form>
        </section>
      </div>

      <div v-if="detailNode" class="drawer-backdrop" @click.self="closeNodeDetail">
        <aside class="node-drawer" role="dialog" aria-modal="true">
          <header class="drawer-head">
            <div>
              <p class="eyebrow">{{ detailNode.subtitle }}</p>
              <h2>{{ detailNode.title }}</h2>
            </div>
            <button type="button" @click="closeNodeDetail">关闭</button>
          </header>
          <section v-for="section in detailNode.sections" :key="section.title" class="detail-block">
            <h3>{{ section.title }}</h3>
            <div class="detail-grid">
              <div v-for="item in section.items" :key="`${section.title}-${item.label}`">
                <span>{{ item.label }}</span>
                <strong>
                  <em v-if="item.state" :class="['pill', item.state]">{{ item.value }}</em>
                  <template v-else>{{ item.value }}</template>
                </strong>
              </div>
            </div>
          </section>
        </aside>
      </div>

      <div v-if="tokenDialog.open" class="modal-backdrop" @click.self="closeTokenDialog">
        <section class="modal token-dialog" role="dialog" aria-modal="true">
          <h2>{{ tokenDialog.title }}</h2>
          <p>{{ tokenDialog.message }}</p>
          <label v-if="tokenDialog.requireToken">
            <span>管理令牌</span>
            <input
              v-model="tokenDialog.token"
              type="password"
              autocomplete="off"
              placeholder="请输入 ADMIN_TOKEN"
              @keyup.enter="confirmTokenDialog"
            >
          </label>
          <div class="modal-actions">
            <button type="button" :disabled="busy" @click="closeTokenDialog">取消</button>
            <button class="primary" type="button" :disabled="busy" @click="confirmTokenDialog">
              {{ tokenDialog.confirmText }}
            </button>
          </div>
        </section>
      </div>
    </main>
    </template>
  </div>

  <script src="vendor/vue.global.prod.js"></script>
  <script type="module" src="app.js?v=20260723-trusted-boot"></script>
</body>
</html>
